<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Form</title>
    <link rel="stylesheet" href="css/BootStrap.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <form action="" class="mt-4 ms-4">
        <label for="txtNome">Inserisci il tuo nome: </label>
        <input type="text" name="Nome" id="txtNome">

        <br><br>

        <label for="txtEmail">Inseriscin qua la tua Email: </label>
        <input type="email" name="txtMail" id="txtEmail">

        <br><br>
        
        <label for="txtMessaggio">Inserisci qua il tuo messaggio: </label>
        <input type="text" name="Messaggio" id="txtMessaggio">

    </form>
    <button onclick="Controlla()" class="btn btn-outline-success mt-3 ms-4">Invia</button>

    <br>

    <h2 id="h2Attenzione"></h2>
    <script src="js/index.js"></script>
</body>
</html>
